name: Image

# Builds the container image of each deployable service (deploy/images/Dockerfile) and checks it. Pushing to Artifact
# Registry is OFF until Workload Identity Federation exists (T-077) and is switched on by repository variables, never by
# a credential in this file. See deploy/README.md.

on:
  push:
    branches: [master]
    paths:
      - "deploy/**"
      - "libs/**"
      - "services/**"
      - "apps/admin/**"
      - "build-logic/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "libs/**"
      - "services/**"
      - "apps/admin/**"
      - "build-logic/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/image.yml"

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            module: services/api
          - service: pricing-bridge
            module: services/pricing-bridge
          - service: admin
            module: apps/admin
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/Dockerfile
          build-args: MODULE=${{ matrix.module }}
          tags: metaldesk-${{ matrix.service }}:ci
          load: true
          provenance: false # an image loaded into the local daemon cannot carry attestations; the push job adds them
          cache-from: type=gha,scope=image-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.service }}

      - name: Runs as a non-root user, with java as PID 1
        run: |
          image=metaldesk-${{ matrix.service }}:ci
          uid=$(docker run --rm --entrypoint id "$image" -u)
          [ "$uid" != 0 ] || { echo "image runs as root" >&2; exit 1; }
          cid=$(docker create "$image")
          cmd=$(docker inspect "$cid" -f '{{json .Config.Entrypoint}}')
          docker rm "$cid" >/dev/null
          echo "uid=$uid entrypoint=$cmd"
          case "$cmd" in '["java",'*) ;; *) echo "entrypoint is not java in exec form" >&2; exit 1 ;; esac

      - name: Carries no credential
        run: |
          image=metaldesk-${{ matrix.service }}:ci
          if docker history --no-trunc "$image" | grep -iE 'secret|password|signing|credential|MONGODB_URI'; then
            echo "a credential-looking string is in the image history" >&2; exit 1
          fi
          leftovers=$(docker run --rm --entrypoint sh "$image" -c 'find / -xdev \( -name ".env*" -o -name "application-local*" \) 2>/dev/null')
          [ -z "$leftovers" ] || { echo "local configuration in the image: $leftovers" >&2; exit 1; }

      # pricing-bridge is the one service that needs no database, so it can start here. api and admin need MongoDB at
      # startup (Mongock), which the JVM build's Testcontainers tests already exercise.
      - name: Starts, answers /actuator/health, and shuts down gracefully on SIGTERM
        if: matrix.service == 'pricing-bridge'
        run: |
          docker run -d --name smoke -p 8083:8083 metaldesk-pricing-bridge:ci
          for _ in $(seq 1 45); do
            curl -fsS http://localhost:8083/actuator/health && break
            sleep 2
          done
          curl -fsS http://localhost:8083/actuator/health | grep -q '"status":"UP"'
          docker kill --signal=TERM smoke
          sleep 8
          docker logs smoke 2>&1 | grep -q 'Graceful shutdown complete'

  # Pushes by commit SHA, only when explicitly switched on. Until T-077 creates Workload Identity Federation there is
  # nothing to authenticate with, so this job is skipped; no credential is, or may be, added here to make it run sooner.
  #   IMAGE_PUSH_ENABLED   "true" to push (repository variable)
  #   IMAGE_REGISTRY_HOST  for example europe-west3-docker.pkg.dev
  #   IMAGE_PROJECT_ID     the GCP project that holds the repositories
  #   IMAGE_ENV            dev, staging or prod (repositories are metaldesk-<env>-<service>)
  #   WIF_PROVIDER, WIF_SERVICE_ACCOUNT   outputs of T-077
  push:
    name: Push ${{ matrix.service }}
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.IMAGE_PUSH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived Google token through Workload Identity Federation
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            module: services/api
          - service: pricing-bridge
            module: services/pricing-bridge
          - service: admin
            module: apps/admin
    env:
      IMAGE: ${{ vars.IMAGE_REGISTRY_HOST }}/${{ vars.IMAGE_PROJECT_ID }}/metaldesk-${{ vars.IMAGE_ENV }}-${{ matrix.service }}/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.IMAGE_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags are immutable, so pushing the same commit twice would fail. A re-run finds the tag and stops.
      - name: Already pushed?
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.pushed != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/Dockerfile
          build-args: MODULE=${{ matrix.module }}
          tags: ${{ env.IMAGE }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.service }}
