server:
  port: 8082

spring:
  application:
    name: metal-api
  mongodb:
    # A local instance by default; a deployment supplies its own through MONGODB_URI. No credential
    # belongs in this file (ADR-0002).
    uri: ${MONGODB_URI:mongodb://localhost:27017/metaldesk}
  data:
    mongodb:
      # Indexes are declared on the documents; this is what makes the driver create them. An Atlas
      # deployment that manages indexes itself should switch this off.
      auto-index-creation: true

metaldesk:
  jwt:
    issuer: metal-desk-api
    audience: metal-desk-storefront
    ttl: 15m
    # Base64 of at least 32 random bytes, supplied by the deployment (Secret Manager). Left empty, a
    # random key is generated at startup: fine for development, never for a deployment.
    signing-key: ${JWT_SIGNING_KEY:}
  auth:
    throttle:
      # FR-2.2's illustrative policy: lock a source after 3 consecutive failures.
      max-failures: 3
      cool-down: 15m
      # Reverse proxies allowed to vouch for X-Forwarded-For (addresses or CIDR blocks). Empty
      # means the peer address is used and the header is ignored.
      trusted-proxies: []
  account:
    verification:
      # A typed verification code, and a password-reset link, live this long. Short on purpose.
      ttl: 15m
      reset-ttl: 30m
      # A challenge is dead after this many confirmation attempts, right code or not.
      max-attempts: 5
      # The page a reset link points at; the reference and code are appended as query parameters.
      link-base: http://localhost:5173/reset-password
  cart:
    # The cart reference cookie. A deployment behind TLS sets cookie-secure to true.
    cookie-max-age: 30d
    cookie-secure: false
