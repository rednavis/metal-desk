# Build-wide Gradle behaviour (T-063). Shared plugin behaviour lives in build-logic, not here.

# Reuse task outputs across builds and across clean checkouts. Spotless, Checkstyle, SpotBugs, PMD,
# Jacoco and compilation are all cacheable; a failing gate is never cached, so the cache cannot mask it.
org.gradle.caching=true

# Six independent modules: run their tasks in parallel.
org.gradle.parallel=true

# SpotBugs at Effort.MAX needs more than the daemon default; with parallel execution an undersized heap
# shows up as an OutOfMemoryError that reads like a test failure. Heap dumps are off — they are large
# and land in the project directory.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Skip the configuration phase when the build scripts and their inputs are unchanged. Spotless, Checkstyle,
# SpotBugs, PMD, Jacoco and the Spring Boot plugin all pass with it on. The one incompatibility found was
# in our own services/api/build.gradle.kts (a doFirst lambda capturing the script object), fixed there.
org.gradle.configuration-cache=true
